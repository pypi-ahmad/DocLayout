[project]
name = "doclayout"
version = "2.1.0"
description = "From scans and images to structured Markdown."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "DocLayout" },
]
requires-python = ">=3.10,<4"
keywords = ["pdf", "markdown", "ocr", "nlp"]
dependencies = [
    "pillow>=11,<13",
    "pydantic>=2.4.2,<3",
    "pydantic-settings>=2.0.3,<3",
    "python-dotenv>=1.0.0,<2",
    "tqdm>=4.66.1,<5",
    "rapidfuzz>=3.8.1,<4",
    "regex>=2024.4.28",
    "pdftext>=0.7.0,<0.8.0",
    "markdownify>=1.1.0,<2",
    "click>=8.2.0,<9",
    "markdown2>=2.5.2,<3",
    "filetype>=1.2.0,<2",
    "openai>=2.2.0,<3",
    "scikit-learn>=1.6.1,<2",
    "beautifulsoup4>=4.12,<5",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pypdfium2>=4.30,<6",
    "requests>=2.32,<3",
    "bleach>=6.2,<7",
    "latex2mathml>=3.77.0",
]

[project.urls]
Repository = "https://github.com/pypi-ahmad/DocLayout"
Issues = "https://github.com/pypi-ahmad/DocLayout/issues"

[project.optional-dependencies]
full = [
    "mammoth>=1.9.0,<2",
    "openpyxl>=3.1.5,<4",
    "python-pptx>=1.0.2,<2",
    "ebooklib>=0.18,<0.19",
    "weasyprint>=63.1,<64",
]
gui = [
    "streamlit>=1.59,<2",
]
server = [
    "fastapi>=0.115.4",
    "python-multipart>=0.0.16",
    "uvicorn>=0.32.0",
]

[project.scripts]
doclayout = "doclayout.scripts.convert:convert_cli"
doclayout_single = "doclayout.scripts.convert_single:convert_single_cli"
doclayout_gui = "doclayout.scripts.run_streamlit_app:streamlit_app_cli"
doclayout_server = "doclayout.scripts.server:server_cli"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "streamlit>=1.59,<2",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.16",
    "pytest>=8.3.3",
    "playwright>=1.49.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doclayout"]
